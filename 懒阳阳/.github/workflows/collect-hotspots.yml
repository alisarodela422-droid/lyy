name: collect-hotspots

on:
  schedule:
    # 每天早 10:00 和晚 18:00 各跑一次 (北京时间 UTC+8)
    - cron: "0 2,10 * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 懒阳阳

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_HOTSPOT_TABLE_ID: ${{ secrets.FEISHU_HOTSPOT_TABLE_ID }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python -m collector --sources weibo,baidu
